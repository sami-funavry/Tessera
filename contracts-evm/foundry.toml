[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
cache    = true
optimizer        = true
optimizer_runs   = 200
via_ir           = false
solc             = "0.8.24"
remappings       = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

[profile.default.fuzz]
runs = 256
seed = "0x3141592653589793"

[profile.default.invariant]
runs   = 64
depth  = 15

[profile.ci]
fuzz   = { runs = 1024 }
invariant = { runs = 256 }

[profile.default.fmt]
line_length            = 100
tab_width              = 4
bracket_spacing        = true
int_types              = "long"
multiline_func_header  = "attributes_first"
quote_style            = "double"
number_underscore      = "thousands"
wrap_comments          = true
