[package]
name        = "verifier"
version     = "0.1.0"
edition     = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std    = { workspace = true }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
cw2             = { workspace = true }
schemars        = { workspace = true }
serde           = { workspace = true }
thiserror       = { workspace = true }
tessera-types   = { workspace = true }
sha2            = { version = "0.10", default-features = false }
hex             = { version = "0.4", default-features = false }

[dev-dependencies]
cw-multi-test      = { workspace = true }
bond               = { path = "../../contracts/bond" }
relayer-registry   = { path = "../../contracts/relayer-registry" }
tusdc              = { path = "../../contracts/tusdc" }
bridge-mint        = { path = "../../contracts/bridge-mint" }
bridge-vault       = { path = "../../contracts/bridge-vault" }

[lints]
workspace = true
